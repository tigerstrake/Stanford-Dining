# Stanford Dining Recommender — Dietary Preferences
#
# This file is the single source of truth for what gets recommended and penalized.
# Both the deterministic scorer and the AI prompt are generated from it.
#
# To tune scoring: adjust 'score' values. Positive = bonus, negative = penalty.
# To add/remove foods: edit 'keywords' lists. Matching is case-insensitive and
# checks both the item name and the ingredient text.

description: >
  Optimize for health and ingredient quality. Prioritize whole foods,
  high protein, vegetables, legumes, whole grains, fruit, nuts, yogurt,
  minimally processed foods, and balanced meals. Avoid ultra-processed foods,
  fried foods, sugary desserts, refined-carb-heavy meals, refined-carb-only
  meals, and low-quality processed meats.

notes:
  - Used to be vegetarian but now eats meat for health reasons.
  - Recommend meat only when minimally processed and whole — grilled chicken, turkey, lean beef, lamb, or similar.
  - Do not recommend processed meat, breaded meat, nugget-style chicken, hot dogs, low-quality deli meats, or anything that feels like mystery meat.
  - Do not recommend fish or seafood.
  - Do not recommend plain or pure egg dishes such as scrambled eggs, boiled eggs, omelets, or egg-forward meals.
  - Vegetarian options are welcome if they are nutritionally strong (tofu, lentils, beans, chickpeas, yogurt, etc.).

