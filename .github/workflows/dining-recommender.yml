name: Stanford Dining Recommender

on:
  workflow_dispatch:
    inputs:
      meal:
        description: "Meal (auto/breakfast/lunch/brunch/dinner)"
        required: false
        default: "auto"
      date:
        description: "Date (YYYY-MM-DD, leave blank for today)"
        required: false
        default: ""
      no_ai:
        description: "Skip AI (true/false)"
        required: false
        default: "false"

# Manual runs only. The schedule lives in a systemd timer on the home server
# (deploy/systemd/); GitHub's cron fired hours late and shut itself off after
# 60 days without a commit.

permissions:
  contents: read

jobs:
  recommend:
    name: Fetch menus and recommend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run recommender
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MEAL="${{ github.event.inputs.meal || 'auto' }}"
          NO_AI="${{ github.event.inputs.no_ai || 'false' }}"
          DATE_ARG="${{ github.event.inputs.date || '' }}"

          CMD="python -m src.main --meal $MEAL"
          if [ -n "$DATE_ARG" ]; then
            CMD="$CMD --date $DATE_ARG"
          fi
          if [ "$NO_AI" = "true" ]; then
            CMD="$CMD --no-ai"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dining-data-${{ github.run_id }}
          path: data/
          retention-days: 7
